name: Backend Build and Deploy

# Disabled auto-deploy - not configured for new project
# on:
#   push:
#     branches:
#       - master
#   workflow_dispatch:
on:
  workflow_dispatch:  # Only manual trigger, no auto-deploy on push  

env:
  PROJECT_ID: regal-framework-475315-m1
  REGION: europe-west1
  ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: docker-repo
  IMAGE_NAME: ub-travel-services-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_full: ${{ steps.image.outputs.full }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Generate image tag
        id: image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="v-${SHORT_SHA}-$(date +%s)"
          IMAGE_FULL="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full=${IMAGE_FULL}" >> $GITHUB_OUTPUT
          echo "Building image: ${IMAGE_FULL}"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.image.outputs.full }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ steps.image.outputs.full }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Output image info
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Image: ${{ steps.image.outputs.full }}"
          echo "🏷️  Tag: ${{ steps.image.outputs.tag }}"

  trigger-terraform:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Terraform deployment
        env:
          GH_TOKEN: ${{ secrets.TERRAFORM_REPO_TOKEN }}
        run: |
          echo "Triggering Terraform deployment..."
          echo "Image: ${{ needs.build-and-push.outputs.image_full }}"
          
          # Make the API call and capture output
          RESPONSE=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/HristevMartin/constructionPlatformInfra/dispatches \
            -f event_type='deploy-backend' \
            -f client_payload[image]='${{ needs.build-and-push.outputs.image_full }}' \
            -f client_payload[tag]='${{ needs.build-and-push.outputs.image_tag }}' \
            -f client_payload[sha]='${{ github.sha }}' \
            -f client_payload[actor]='${{ github.actor }}' 2>&1) || {
            echo "❌ Failed to trigger deployment"
            echo "Response: $RESPONSE"
            exit 1
          }
          
          echo "✅ Repository dispatch sent successfully"
          if [ -n "$RESPONSE" ]; then
            echo "Response: $RESPONSE"
          fi
      
      - name: Deployment triggered
        run: |
          echo "🚀 Terraform deployment triggered!"
          echo "📦 Image: ${{ needs.build-and-push.outputs.image_full }}"
          echo "Check the constructionPlatformInfra repository for deployment status"